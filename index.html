<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard psicrométrico</title>
<style>
:root{--bg:#eef3f4;--panel:#fff;--ink:#12263a;--mute:#5b6b78;--grid:#d5e0e0;--rh:#0e7c86;--h:#b5651d;--wb:#3b6fb6;--v:#7a5aa6;--a:#c2312f;--b:#1f8a4c;--bar:#12263a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c151c;--panel:#15232d;--ink:#e6eef2;--mute:#93a5b1;--grid:#2a3c48;--rh:#4cc4cf;--h:#e0975a;--wb:#7aa7e6;--v:#b99be6;--a:#ff6b66;--b:#4fd68a;--bar:#0a1218;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;line-height:1.45}
header{background:var(--bar);color:#e6eef2;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:1.15rem;margin:0;font-weight:600}
header small{color:#9fb3c0;display:block;font-weight:400}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:.85rem;padding:7px 12px;border-radius:5px;border:1px solid #3d5566;background:transparent;color:#e6eef2;cursor:pointer}
button:hover{background:#1d3342}
button:focus-visible,input:focus-visible{outline:2px solid var(--rh);outline-offset:2px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:14px}
.side{display:flex;flex-direction:column;gap:14px}
.card h2{font-size:.95rem;margin:0 0 6px;font-weight:600}
.card h2 i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
label{display:block;font-size:.85rem;margin-top:8px;color:var(--mute)}
label b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--rh)}
input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--grid);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
.k{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:10px 12px}
.k span{font-size:.78rem;color:var(--mute);display:block}
.k strong{font-size:1.25rem;font-variant-numeric:tabular-nums}
.k em{font-style:normal;font-size:.78rem;color:var(--mute);margin-left:3px}
.k small{display:block;font-size:.78rem;color:var(--b);font-variant-numeric:tabular-nums}
.chart{overflow-x:auto;padding:8px}
svg{display:block;min-width:680px;width:100%;height:auto}
.proc{display:none}.proc.on{display:block}
.proc dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:8px 0 0;font-size:.9rem}
.proc dt{color:var(--mute)}.proc dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.leg{font-size:.8rem;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 16px}
.leg span{display:inline-block;width:22px;border-top:2px solid;vertical-align:middle;margin-right:6px}
@media print{header .btns,.side{display:none}.layout{display:block;padding:0}body{background:#fff}}
</style>
</head>
<body>
<header>
  <h1>Dashboard psicrométrico<small id="pinfo"></small></h1>
  <div class="btns"><button id="bsvg">Descargar SVG</button><button id="bprint">Imprimir / PDF</button></div>
</header>
<div class="layout">
<div class="side">
  <div class="card"><h2>Lugar</h2>
    <label>Altitud sobre el nivel del mar (m)<input id="z" type="number" min="0" max="5000" step="50" value="0"></label>
  </div>
  <div class="card"><h2><i style="background:var(--a)"></i>Punto A</h2>
    <label>Bulbo seco: <b id="tav">30</b> °C<input id="ta" type="range" min="0" max="50" step="0.5" value="30"></label>
    <label>Humedad relativa: <b id="rav">60</b> %<input id="ra" type="range" min="5" max="100" step="1" value="60"></label>
  </div>
  <div class="card"><h2><i style="background:var(--b)"></i>Punto B (proceso)</h2>
    <label><input id="useB" type="checkbox"> Activar proceso A → B</label>
    <label>Bulbo seco: <b id="tbv">15</b> °C<input id="tb" type="range" min="0" max="50" step="0.5" value="15"></label>
    <label>Humedad relativa: <b id="rbv">90</b> %<input id="rb" type="range" min="5" max="100" step="1" value="90"></label>
    <label>Caudal de aire (m³/h)<input id="flow" type="number" min="0" step="100" value="1000"></label>
    <div class="proc" id="proc"><dl id="pout"></dl></div>
  </div>
</div>
<div class="main">
  <div class="kpis" id="kpis"></div>
  <div class="card chart"><svg id="c" viewBox="0 0 900 600" role="img" aria-label="Carta psicrométrica"></svg></div>
  <div class="leg">
    <div><span style="border-color:var(--rh)"></span>Humedad relativa (%)</div>
    <div><span style="border-color:var(--h)"></span>Entalpía (kJ/kg)</div>
    <div><span style="border-color:var(--wb);border-top-style:dashed"></span>Bulbo húmedo (°C)</div>
    <div><span style="border-color:var(--v);border-top-style:dotted"></span>Volumen específico (m³/kg)</div>
  </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const L=60,R=830,T0=30,B=550;
let P=101.325,YM=0.03;
const X=t=>L+(R-L)*t/50, Y=w=>B-(B-T0)*w/YM;
const Ps=t=>0.61094*Math.exp(17.625*t/(t+243.04));
const Wf=(t,rh)=>{const pv=Ps(t)*rh/100;return 0.622*pv/(P-pv)};
const Hf=(t,w)=>1.006*t+w*(2501+1.86*t);
const Vf=(t,w)=>0.287042*(t+273.15)*(1+1.607858*w)/P;
const Tdew=(t,rh)=>{const a=Math.log(Ps(t)*rh/100/0.61094);return 243.04*a/(17.625-a)};
const WfromTw=(t,tw)=>{const ws=Wf(tw,100);return((2501-2.326*tw)*ws-1.006*(t-tw))/(2501+1.86*t-4.186*tw)};
function Twb(t,w){let lo=-10,hi=t;for(let i=0;i<50;i++){const m=(lo+hi)/2;WfromTw(t,m)>w?hi=m:lo=m}return(lo+hi)/2}
const state=(t,rh)=>{const w=Wf(t,rh);return{t,rh,w,h:Hf(t,w),v:Vf(t,w),td:Tdew(t,rh),tw:Twb(t,w)}};
const NS='http://www.w3.org/2000/svg',svg=$('c');
function el(n,a,txt){const e=document.createElementNS(NS,n);if(n=='text'){e.setAttribute('fill','var(--mute)');e.setAttribute('font-size','11');e.setAttribute('font-family','Segoe UI,Arial,sans-serif')}for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e}
const path=(pts,a)=>pts.length>1&&el('path',Object.assign({d:'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L'),fill:'none'},a));
function base(){
  svg.innerHTML='';
  el('rect',{x:0,y:0,width:900,height:600,fill:'var(--panel)'});
  const gm=YM*1000;
  for(let t=0;t<=50;t+=5){el('line',{x1:X(t),x2:X(t),y1:T0,y2:B,stroke:'var(--grid)','stroke-width':t%10?0.5:1});el('text',{x:X(t),y:B+18,'text-anchor':'middle'},t)}
  for(let g=0;g<=gm;g+=5){el('line',{x1:L,x2:R,y1:Y(g/1000),y2:Y(g/1000),stroke:'var(--grid)','stroke-width':g%10?0.5:1});el('text',{x:R+8,y:Y(g/1000)+4},g)}
  el('text',{x:(L+R)/2,y:B+40,'text-anchor':'middle'},'Temperatura de bulbo seco (°C)');
  el('text',{x:0,y:0,'text-anchor':'middle',transform:`translate(${R+50},${(T0+B)/2}) rotate(90)`},'Humedad absoluta (g de vapor / kg de aire seco)');
  for(let h=10;h<=160;h+=10){const pts=[];for(let t=-5;t<=50;t+=0.1){const w=(h-1.006*t)/(2501+1.86*t);if(w>=0&&w<=Wf(t,100)&&w<=YM)pts.push([X(Math.max(t,0)),Y(w)])}
    if(pts.length>1){path(pts,{stroke:'var(--h)','stroke-width':0.8});el('text',{x:pts[0][0]-4,y:pts[0][1]-6,'text-anchor':'end',fill:'var(--h)'},h)}}
  for(let tw=0;tw<=35;tw+=5){const ws=Wf(tw,100),te=tw+(2501-2.326*tw)*ws/1.006,pts=[];for(let t=tw;t<=Math.min(te,50);t+=0.25){const w=WfromTw(t,tw);if(w>=0&&w<=YM)pts.push([X(t),Y(w)])}
    path(pts,{stroke:'var(--wb)','stroke-width':0.9,'stroke-dasharray':'5 3'});if(pts.length)el('text',{x:pts[0][0]-3,y:pts[0][1]+12,'text-anchor':'end',fill:'var(--wb)'},tw)}
  for(let v=0.70;v<=1.10;v+=0.05){const pts=[];for(let t=-5;t<=50;t+=0.25){const w=(v*P/(0.287042*(t+273.15))-1)/1.607858;if(w>=0&&w<=Wf(t,100)&&w<=YM)pts.push([X(Math.max(t,0)),Y(w)])}
    if(pts.length>1){path(pts,{stroke:'var(--v)','stroke-width':0.9,'stroke-dasharray':'1.5 3'});const q=pts[pts.length-1];el('text',{x:q[0],y:q[1]+(q[1]>B-3?14:-5),'text-anchor':'middle',fill:'var(--v)'},v.toFixed(2))}}
  for(let rh=10;rh<=100;rh+=10){const pts=[];for(let t=0;t<=50;t+=0.5){const w=Wf(t,rh);if(w<=YM)pts.push([X(t),Y(w)])}
    path(pts,{stroke:'var(--rh)','stroke-width':rh==100?2.4:1.1});const q=pts[pts.length-1];
    if(rh<100&&q)el('text',{x:q[0]-4,y:q[1]-5,'text-anchor':'end',fill:'var(--rh)'},rh+'%')}
  el('rect',{x:L,y:T0,width:R-L,height:B-T0,fill:'none',stroke:'var(--ink)','stroke-width':1.2});
}
function dot(s,c,name,rocio){
  if(s.w>YM)return;
  if(rocio){el('line',{x1:X(s.t),x2:X(s.t),y1:Y(s.w),y2:B,stroke:c,'stroke-dasharray':'4 3'});
    el('line',{x1:X(s.t),x2:X(Math.max(s.td,0)),y1:Y(s.w),y2:Y(s.w),stroke:c,'stroke-dasharray':'4 3'});
    el('circle',{cx:X(Math.max(s.td,0)),cy:Y(s.w),r:3.5,fill:'var(--panel)',stroke:c,'stroke-width':1.5})}
  el('circle',{cx:X(s.t),cy:Y(s.w),r:6,fill:c,stroke:'var(--panel)','stroke-width':2});
  el('text',{x:X(s.t)+9,y:Y(s.w)-8,fill:c,'font-size':'13','font-weight':'700'},name);
}
const fmt=(x,d)=>x.toFixed(d).replace('.',',');
function update(){
  const z=Math.max(0,+$('z').value||0);
  P=101.325*Math.pow(1-2.25577e-5*z,5.25588);YM=P<85?0.04:0.03;
  $('pinfo').textContent=`Presión ${fmt(P,2)} kPa · altitud ${z} m`;
  const A=state(+$('ta').value,+$('ra').value);
  $('tav').textContent=A.t;$('rav').textContent=A.rh;
  const useB=$('useB').checked;
  const Bs=state(+$('tb').value,+$('rb').value);
  $('tbv').textContent=Bs.t;$('rbv').textContent=Bs.rh;
  base();
  if(useB&&A.w<=YM&&Bs.w<=YM){el('line',{x1:X(A.t),y1:Y(A.w),x2:X(Bs.t),y2:Y(Bs.w),stroke:'var(--ink)','stroke-width':1.8,'stroke-dasharray':'7 4'})}
  dot(A,'var(--a)','A',true);
  if(useB)dot(Bs,'var(--b)','B',false);
  const K=[['Bulbo seco',fmt(A.t,1),'°C'],['Humedad relativa',fmt(A.rh,0),'%'],['Humedad absoluta',fmt(A.w*1000,2),'g/kg'],['Punto de rocío',fmt(A.td,1),'°C'],['Bulbo húmedo',fmt(A.tw,1),'°C'],['Entalpía',fmt(A.h,1),'kJ/kg'],['Volumen específico',fmt(A.v,3),'m³/kg']];
  $('kpis').innerHTML=K.map(k=>`<div class="k"><span>${k[0]}</span><strong>${k[1]}</strong><em>${k[2]}</em></div>`).join('');
  $('proc').classList.toggle('on',useB);
  if(useB){
    const dh=Bs.h-A.h,dw=(Bs.w-A.w)*1000,m=(+$('flow').value||0)/A.v/3600,Q=m*dh;
    const sens=m*(1.006+1.86*A.w)*(Bs.t-A.t),lat=Q-sens;
    $('pout').innerHTML=[['Δ Temperatura',fmt(Bs.t-A.t,1)+' °C'],['Δ Humedad abs.',fmt(dw,2)+' g/kg'],['Δ Entalpía',fmt(dh,1)+' kJ/kg'],['Flujo másico',fmt(m,3)+' kg/s'],['Calor sensible',fmt(sens,2)+' kW'],['Calor latente',fmt(lat,2)+' kW'],['Calor total',fmt(Q,2)+' kW']].map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')+'<dt style="grid-column:1/3;font-size:.78rem">Negativo = el aire cede calor (enfriamiento); positivo = lo recibe.</dt>';
  }
}
['z','ta','ra','tb','rb','useB','flow'].forEach(i=>{$(i).addEventListener('input',update);$(i).addEventListener('change',update)});
$('bprint').onclick=()=>window.print();
$('bsvg').onclick=()=>{
  const cs=getComputedStyle(document.documentElement);
  let s=new XMLSerializer().serializeToString(svg).replace(/var\(--([\w-]+)\)/g,(m,n)=>cs.getPropertyValue('--'+n).trim());
  const blob=new Blob([s],{type:'image/svg+xml'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='carta_psicrometrica.svg';a.click();URL.revokeObjectURL(a.href);
};
update();
</script>
</body>
</html>
